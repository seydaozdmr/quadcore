services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: retroaction-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: retrodb
      POSTGRES_USER: retro
      POSTGRES_PASSWORD: retro123
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retro -d retrodb"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
